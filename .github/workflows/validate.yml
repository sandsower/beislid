name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-skills:
    name: Skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_skills.py

  skill-size-budgets:
    name: Skill size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_skill_size_budgets.py

  check-links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --exclude-loopback './**/*.md'
          fail: true

  smoke-install:
    name: install.sh integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_install.sh

  release-bump:
    name: Release bump script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_bump_version.sh

  run-ledger:
    name: Run ledger utility tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: bash scripts/test_run_ledger.sh

  action-policy:
    name: Action policy evaluator tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: bash scripts/test_action_policy.sh
      - run: bash scripts/test_action_policy_protocol.sh

  symlink-integrity:
    name: Shared format doc symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify per-skill auxiliaries are symlinks to .beislid masters
        run: |
          required='skills/setup/workflow-md-format.md
          skills/setup/probe-semantics.md
          skills/doctor/workflow-md-format.md
          skills/doctor/probe-semantics.md
          skills/doctor/output-templates.md
          skills/doctor/doctor-templates.md
          skills/ready-for-review/workflow-md-format.md
          skills/ready-for-review/probe-semantics.md
          skills/ready-for-review/output-templates.md
          skills/ready-for-review/ready-for-review-templates.md
          skills/kickoff/workflow-md-format.md
          skills/kickoff/probe-semantics.md
          skills/kickoff/output-templates.md
          skills/kickoff/kickoff-templates.md
          skills/kickoff/action-policy-protocol.md
          skills/implement/action-policy-protocol.md
          skills/review-response/workflow-md-format.md
          skills/review-response/probe-semantics.md
          skills/review-response/output-templates.md
          skills/review-response/review-response-templates.md
          skills/review-response/action-policy-protocol.md
          skills/ready-for-review/action-policy-protocol.md'

          missing_or_not_symlink=$(printf '%s\n' "$required" | while read -r path; do
            [ -L "$path" ] || echo "$path"
          done)
          if [ -n "$missing_or_not_symlink" ]; then
            echo "Missing or non-symlink required aux files:"
            echo "$missing_or_not_symlink"
            echo ""
            echo "Re-link them as: ln -sf ../../.beislid/<name>.md skills/<skill>/<name>.md"
            exit 1
          fi

          stray_regular=$(find skills \( -name 'probe-semantics.md' \
                                -o -name 'workflow-md-format.md' \
                                -o -name 'output-templates.md' \
                                -o -name 'doctor-templates.md' \
                                -o -name 'ready-for-review-templates.md' \
                                -o -name 'kickoff-templates.md' \
                                -o -name 'review-response-templates.md' \
                                -o -name 'action-policy-protocol.md' \) \
                    | xargs -I{} sh -c '[ -L "{}" ] || echo "{}"')
          if [ -n "$stray_regular" ]; then
            echo "Found per-skill aux files that should be symlinks but are regular files:"
            echo "$stray_regular"
            exit 1
          fi
          echo "ok: all required aux files are present symlinks"

  consistency-checks:
    name: Doc consistency checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 scripts/check_artifact_templates_consistency.py
      - run: python3 scripts/check_contract_schema_consistency.py
      - run: python3 scripts/check_lifecycle_hooks_consistency.py
      - run: python3 scripts/check_model_routing_step_hints_consistency.py
      - run: python3 scripts/check_planning_lifecycle_consistency.py
      - run: python3 scripts/check_run_ledger_skill_examples_consistency.py
      - run: python3 scripts/check_visual_surfaces_consistency.py
      - run: python3 scripts/check_workflow_signals_consistency.py

  script-tests:
    name: Validator and helper script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: bash scripts/test_validate_export.sh
      - run: bash scripts/test_validate_skills.sh
      - run: python3 scripts/test_workflow_normalizer.py
      - run: python3 scripts/test_visual_feedback.py
      # Harness self-test only: every host invocation is mocked, no live agents.
      - run: python3 scripts/test_agent_smoke_harness.py

  show-me-tests:
    name: Show-me integrity tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm test

  validate-exports:
    name: Committed export bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate every committed bundle under .beislid/exports
        run: |
          shopt -s nullglob
          bundles=(.beislid/exports/*/)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "no committed bundles to validate"
            exit 0
          fi
          status=0
          for bundle in "${bundles[@]}"; do
            echo "=== $bundle ==="
            python3 scripts/validate_export.py "$bundle" || status=1
          done
          exit $status
